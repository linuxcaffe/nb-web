<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nb-web</title>
  <script>(function(){var t=localStorage.getItem('nb-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="jsuites.min.css">
  <link rel="stylesheet" href="jspreadsheet.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" id="nb-prism-theme" href="prism-tomorrow.min.css">
  <script>(function(){var t=localStorage.getItem('nb-theme');var l=document.getElementById('nb-prism-theme');if(l)l.href=t==='light'?'prism-light.min.css':'prism-tomorrow.min.css';})();</script>
  <link rel="manifest" href="manifest.json">
</head>
<body>

<!-- ── Command bar ──────────────────────────────────────────────── -->
<header id="nb-cmd-bar">
  <button id="nb-logo-btn" class="nb-logo-btn" title="Menu"><img src="/nb-logo.png" alt="nb" class="nb-logo-img"></button>
  <span class="nb-cmd-group-sep" aria-hidden="true"></span>
  <div id="nb-cmds-builtin">
    <button class="nb-cmd" data-cmd="add">Add</button>
    <button class="nb-cmd active" data-cmd="list">List</button>
  </div>
  <span class="nb-cmd-group-sep" aria-hidden="true"></span>
  <div id="nb-cmds-plugins">
    <button class="nb-cmd nb-cmd-plugin" data-cmd="contacts" title="Contacts">🪪</button>
  </div>
  <div id="nb-search-wrap">
    <button id="nb-cal-icon" class="nb-search-icon-btn" data-cmd="cal" title="Calendar">📅</button>
    <input id="nb-search" type="search" placeholder="search…" autocomplete="off" spellcheck="false">
    <button id="nb-search-clear" class="nb-icon-btn nb-search-x" title="Clear search" hidden>✕</button>
    <span class="nb-search-sep" aria-hidden="true"></span>
    <input id="nb-tags" type="text" placeholder="tags…" autocomplete="off" spellcheck="false">
    <button id="nb-tags-clear" class="nb-icon-btn nb-search-x" title="Clear tags" hidden>✕</button>
  </div>
</header>

<!-- ── Command opts bar ─────────────────────────────────────────── -->
<div id="nb-cmd-opts-bar"><!-- populated by nav.js --></div>

<!-- ── Breadcrumb (folder drill) ───────────────────────────────── -->
<div id="nb-breadcrumb" hidden></div>

<!-- ── Command output bar ───────────────────────────────────────── -->
<div id="nb-cmd-output-bar" hidden>
  <span class="nb-cmd-output-prompt" title="Active filters">⊘</span>
  <span id="nb-cmd-output-tokens" class="nb-cmd-tokens"></span>
  <button id="nb-cmd-output-clear" class="nb-icon-btn" title="Clear all filters">×</button>
</div>

<!-- ── Main layout ─────────────────────────────────────────────── -->
<div id="nb-layout">

  <!-- List pane -->
  <aside id="nb-list-pane">
    <div id="nb-list-meta">
      <button class="nb-panel-menu-btn" id="nb-list-menu-btn" title="List options">☰</button>
      <span id="nb-count"></span>
      <span id="nb-type-breakdown"></span>
      <div id="nb-list-plugin-btns"></div>
      <button id="nb-sort-btn" class="nb-list-sort-btn nb-icon-btn" title="Sort">⇅</button>
    </div>
    <ul id="nb-list" role="listbox" aria-label="Notes"></ul>
    <div id="nb-list-empty" hidden>No items found.</div>
  </aside>

  <!-- Drag handle -->
  <div id="nb-drag-handle" aria-hidden="true"></div>

  <!-- Preview / editor pane -->
  <main id="nb-preview-pane">
    <div id="nb-preview-toolbar" hidden>
      <div class="nb-toolbar-left">
        <button class="nb-panel-menu-btn" id="nb-preview-menu-btn" title="Note options">☰</button>
        <button class="nb-tool-btn" id="nb-extras-btn" title="Show/hide extras (frontmatter, annotations…) — press . to toggle">◉</button>
      </div>
      <div id="nb-preview-renderers"></div>
      <div id="nb-preview-nav">
        <button id="nb-back-btn"    class="nb-tool-btn" title="Go back"    hidden>←</button>
        <button id="nb-forward-btn" class="nb-tool-btn" title="Go forward" hidden>→</button>
        <span id="nb-preview-ref"   class="nb-preview-ref"></span>
        <span id="nb-preview-title"></span>
      </div>
      <div id="nb-preview-actions">
        <span id="nb-pin-indicator" hidden title="Pinned to list top — click to unpin">📌</span>
        <button id="nb-done-btn"       class="nb-tool-btn nb-btn-primary" hidden>Done</button>
        <button id="nb-sheet-save-btn" class="nb-tool-btn nb-btn-primary" hidden>Save</button>
        <button id="nb-open-ext-btn"   class="nb-tool-btn" hidden title="Open with system viewer">↗ Open</button>
        <button id="nb-edit-btn"   class="nb-tool-btn">Edit</button>
        <button id="nb-delete-btn" class="nb-tool-btn nb-btn-danger">Delete</button>
      </div>
    </div>

    <div id="nb-preview-content">
      <div id="nb-welcome">
        <h2>nb-web</h2>
        <p>Select a note, or choose a command above.</p>
      </div>
    </div>

    <!-- Inline editor (hidden until Edit clicked) -->
    <div id="nb-editor-wrap" hidden>
      <div id="nb-editor-toolbar">
        <button class="nb-tool-btn" data-fmt="bold">B</button>
        <button class="nb-tool-btn" data-fmt="italic">I</button>
        <button class="nb-tool-btn" data-fmt="heading">#</button>
        <button class="nb-tool-btn" data-fmt="link">🔗</button>
        <button class="nb-tool-btn" data-fmt="tag">#tag</button>
        <span class="nb-spacer"></span>
        <button id="nb-save-btn"   class="nb-tool-btn nb-btn-primary">Save</button>
        <button id="nb-cancel-btn" class="nb-tool-btn">Cancel</button>
      </div>
      <textarea id="nb-editor" spellcheck="true"></textarea>
    </div>

    <!-- Annotation split-editor (hidden until annotation Edit/Add clicked) -->
    <div id="nb-ann-editor-wrap" hidden>
      <div id="nb-ann-drag-handle"></div>
      <div id="nb-ann-editor-toolbar">
        <button class="nb-tool-btn" data-ann-fmt="bold">B</button>
        <button class="nb-tool-btn" data-ann-fmt="italic">I</button>
        <button class="nb-tool-btn" data-ann-fmt="heading">#</button>
        <button class="nb-tool-btn" data-ann-fmt="link">🔗</button>
        <button class="nb-tool-btn" data-ann-fmt="tag">#tag</button>
        <span class="nb-spacer"></span>
        <button id="nb-ann-save-btn"   class="nb-tool-btn nb-btn-primary">Save</button>
        <button id="nb-ann-cancel-btn" class="nb-tool-btn">Cancel</button>
      </div>
      <textarea id="nb-ann-editor" spellcheck="true" placeholder="Markdown supported…"></textarea>
    </div>
  </main>

</div><!-- #nb-layout -->

<!-- ── Slide-in side menu ──────────────────────────────────────── -->
<div id="nb-menu-overlay" hidden></div>
<aside id="nb-side-menu" aria-label="Application menu">
  <div id="nb-menu-header">
    <img src="/nb-logo.png" alt="nb" class="nb-menu-logo-img">
    <span class="nb-menu-subtitle">nb-web</span>
    <span id="nb-menu-build" class="nb-menu-build">…</span>
    <button id="nb-menu-sync-btn" class="nb-menu-sync-btn">Sync home</button>
  </div>
  <nav id="nb-menu-nav"><!-- populated from cmds.txt via /api/cmds --></nav>
</aside>

<!-- ── Bottom anchor: Journal append ───────────────────────────── -->
<div id="nb-bottom-bar">
  <div id="nb-append-bar" hidden>
    <textarea id="nb-append-input" placeholder="Add to today's log…" rows="1"></textarea>
    <button id="nb-append-btn" class="nb-btn-primary">↑</button>
  </div>
</div>

<!-- ── Full-page drop overlay ───────────────────────────────────── -->
<div id="nb-drop-overlay" aria-hidden="true"></div>


<script src="jsuites.min.js"></script>
<script src="jspreadsheet-formula.min.js"></script>
<script src="jspreadsheet.min.js"></script>
<script src="prism.min.js"></script>
<script src="prism-bash.min.js"></script>
<script src="prism-haskell.min.js"></script>
<script src="prism-ledger.js"></script>
<script src="marked.min.js"></script>
<script src="Sortable.min.js"></script>
<script src="nbweb.js"></script>
<script src="nav.js"></script>
<script src="main.js"></script>
<script>
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
